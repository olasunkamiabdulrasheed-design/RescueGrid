<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RescueGrid — See the risk. Coordinate the response.</title>
<style>
:root{--bg:#0b1220;--s1:#111a2c;--s2:#17223a;--bd:#26334f;--tx:#f4efe6;--mu:#9aa7bf;--or:#fb923c;--rd:#ef4444;--tl:#2dd4bf;--yl:#fbbf24;--bl:#60a5fa;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
a,button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--s2);border:1px solid var(--bd);border-radius:6px;padding:6px 11px;transition:.15s}
button:hover{border-color:var(--mu)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--or);outline-offset:1px}
button.p{background:var(--or);color:#1a0f05;border-color:var(--or);font-weight:600}button.d{border-color:var(--rd);color:#fca5a5}
input,select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:7px 9px;width:100%}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 3px}
#side{position:fixed;inset:0 auto 0 0;width:218px;background:var(--s1);border-right:1px solid var(--bd);padding:16px 10px;z-index:30;overflow:auto;transition:transform .2s}
#side h1{font-size:17px;margin:0 8px 2px}#side small{display:block;margin:0 8px 14px;color:var(--mu);font-size:11px}
.nv{display:flex;gap:9px;width:100%;border:0;background:none;text-align:left;padding:8px 10px;border-radius:6px;color:var(--mu)}
.nv:hover,.nv.on{background:var(--s2);color:var(--tx)}.nv.on{box-shadow:inset 3px 0 var(--or)}
#main{margin-left:218px;min-height:100vh}
#bar{position:sticky;top:0;z-index:20;background:rgba(11,18,32,.95);border-bottom:1px solid var(--bd);padding:8px 18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sim{background:rgba(251,146,60,.12);border:1px solid var(--or);color:var(--or);border-radius:5px;padding:2px 8px;font-size:11px;font-weight:700;letter-spacing:.05em}
#menu{display:none}#pg{padding:18px;max-width:1280px}
h2{margin:0 0 4px;font-size:22px}.sub{color:var(--mu);margin:0 0 16px}
.g{display:grid;gap:12px}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.c{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:14px}.c h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu)}
.k{font-size:28px;font-weight:700}.mu{color:var(--mu)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.b{display:inline-block;border-radius:4px;padding:1px 7px;font-size:11px;font-weight:600;border:1px solid}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd)}th{font-size:11px;color:var(--mu);text-transform:uppercase}
tr.cl{cursor:pointer}tr.cl:hover{background:var(--s2)}.sc{overflow-x:auto}
.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%}
svg text{fill:var(--mu);font-size:3px}.mk{cursor:pointer}
#dr{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--s1);border-left:1px solid var(--bd);z-index:50;padding:18px;overflow:auto}
#md{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:flex;align-items:center;justify-content:center;padding:14px}
#md>div{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:18px;width:min(520px,100%);max-height:92vh;overflow:auto}
#ts{position:fixed;bottom:14px;right:14px;z-index:80;display:grid;gap:6px}
.t{background:var(--s2);border:1px solid var(--tl);border-radius:6px;padding:8px 12px}
.er{color:#fca5a5;font-size:12px}.ft{color:var(--mu);font-size:11px;padding:0 18px 20px}
@keyframes pu{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.65)}50%{box-shadow:0 0 0 6px rgba(239,68,68,0)}}@keyframes sl{from{transform:translateX(22px);opacity:0}}.pulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--rd);animation:pu 1.8s infinite}#dr{animation:sl .2s}#md>div{animation:sl .18s}.k{transition:color .3s}.hero{background:linear-gradient(90deg,rgba(251,146,60,.14),rgba(17,26,44,0));border:1px solid var(--bd);border-left:4px solid var(--or);border-radius:10px;padding:12px 16px;margin-bottom:12px}.nt{position:fixed;right:14px;top:56px;width:min(360px,calc(100% - 28px));background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:12px;z-index:45;max-height:70vh;overflow:auto}.av{width:28px;height:28px;border-radius:50%;background:var(--s2);border:1px solid var(--bd);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}.dg{grid-template-columns:minmax(0,1.8fr) minmax(0,1fr)}.bdg{background:var(--rd);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;margin-left:3px}@media(prefers-reduced-motion:reduce){*{animation:none!important}}@media(max-width:820px){.dg{grid-template-columns:1fr}#gs{max-width:140px!important}#side{transform:translateX(-100%)}#side.o{transform:none}#main{margin-left:0}#menu{display:block}.g2{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<nav id="side" aria-label="Main"></nav>
<div id="main"><header id="bar"></header><main id="pg"></main>
<p class="ft">RescueGrid is a hackathon prototype for IEEE Technothon 2026. All sensor readings, reports, capacities and routes are simulated and unverified. Not connected to any emergency service. In a real emergency, contact your local emergency number.</p></div>
<div id="ts" role="status" aria-live="polite"></div><div id="ov"></div>
<script>
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),$=s=>document.querySelector(s);
const SEV=['Low','Medium','High','Critical'],SC=['#2dd4bf','#fbbf24','#fb923c','#ef4444'],ST=['New','Under review','Response assigned','Resolved'],CAT=['Flooding','Blocked road','Community report','Medical','Shelter'];
const LV=['Normal','Watch','Warning','Critical'],LC=['#2dd4bf','#fbbf24','#fb923c','#ef4444'],TH=[2.5,3.5,4.5],VIS=[6,8,10,12],STG=['Baseline','Watch','Warning','Response'];
const AREAS={'Market Ward':[30,57],'Riverside':[48,72],'Northgate':[22,28],'Hillcrest':[66,28]};
const SENS=[{id:'S1',n:'Northgate Bridge',x:22,y:30,h:[1.2,1.3,1.3,1.5,1.6,1.8,2.2,2.7,3.1,3.6,4.0,4.4]},{id:'S2',n:'Market Ward Canal',x:30,y:58,h:[1.0,1.1,1.2,1.2,1.4,1.5,1.9,2.4,2.9,3.4,3.9,4.7]},{id:'S3',n:'Riverside Weir',x:50,y:72,h:[.8,.9,.9,1.0,1.1,1.2,1.5,1.9,2.3,2.8,3.2,3.6]}];
const ROUTES={'Market Ward':[['Canal Rd','Weir Rd'],2.4,['Mill St','Ridge Ave'],3.9],'Riverside':[['Weir Rd','Canal Rd'],1.8,['Ridge Ave'],3.2],'Northgate':[['Mill St'],1.5,['Ridge Ave','Mill St'],2.6],'Hillcrest':[['Ridge Ave'],1.1,['Mill St','Canal Rd'],3.4]};
const I=(id,title,cat,loc,sev,st,team,x,y,road,time,d)=>({id,title,cat,loc,sev,st,team,x,y,road,time,d});
const SEED=()=>({stage:0,n:110,inc:[
I('INC-101','Standing water on Canal Rd','Flooding','Market Ward',0,0,'',30,55,'Canal Rd','08:10','Shallow pooling reported near the canal footbridge.'),
I('INC-102','Fallen tree blocking Ridge Ave','Blocked road','Hillcrest',1,1,'Team Alpha',65,25,'Ridge Ave','08:25','Tree across both lanes; clearing crew requested.'),
I('INC-103','Resident requests welfare check','Community report','Riverside',1,2,'Team Bravo',45,75,'Weir Rd','08:40','Elderly resident, ground floor property near the weir.'),
I('INC-104','Drainage overflow cleared','Flooding','Northgate',0,3,'Team Alpha',20,32,'Mill St','07:50','Storm drain unblocked by volunteers.')],
sh:[{id:'SH1',n:'Hillcrest Community School',loc:'Hillcrest',cap:220,occ:60,w:400,b:150,m:20,x:70,y:30},{id:'SH2',n:'Riverside Hall',loc:'Riverside',cap:90,occ:20,w:120,b:40,m:3,x:42,y:66},{id:'SH3',n:'Northgate Sports Centre',loc:'Northgate',cap:150,occ:30,w:300,b:100,m:8,x:25,y:20}]});
const ADD={1:[I('INC-105','Riverbank overtopping at Weir','Flooding','Riverside',2,0,'',50,70,'Weir Rd','09:20','Water spilling over the bank near Riverside Weir.'),I('INC-106','Canal Rd impassable','Blocked road','Market Ward',2,0,'',32,52,'Canal Rd','09:35','Depth reports exceed safe passage for vehicles.')],
2:[I('INC-107','Families stranded in Market Ward','Community report','Market Ward',3,0,'',28,60,'Canal Rd','10:15','Several households request assistance leaving.'),I('INC-108','Bridge approach submerged','Blocked road','Northgate',3,0,'',22,35,'Mill St','10:30','Approach road under water; bridge closed.')],
3:[I('INC-109','Shelter overflow risk','Shelter','Riverside',2,0,'',48,62,'Weir Rd','11:00','Riverside Hall nearing capacity; supplies low.')]};
const BUMP={2:[40,30,10],3:[50,35,20]};
const WHY=['Baseline: calm river, shelters lightly used, four routine incidents.','Watch: all three gauges climb past 2.5 m. Two flood and road reports appear near the weir and canal, and the flood zone starts to widen.','Warning: Northgate and Market Ward cross 3.5 m. Two critical reports arrive and shelters begin filling.','Response: Market Ward Canal passes 4.5 m (critical). Shelter occupancy rises sharply, Riverside Hall runs short of water and bedding, and priorities concentrate on Market Ward.'];
let S,U={page:'dashboard',q:'',sev:'',st:'',sel:null,dr:null,md:null,nav:false,rs:'Market Ward',rd:'SH1',L:{Flooding:1,'Blocked road':1,report:1,shelter:1,sensor:1},err:{},photo:''};
const load=()=>{try{const s=JSON.parse(localStorage.getItem('rg1'));if(s&&s.inc)return s}catch(x){}return SEED()};S=load();
const save=()=>{try{localStorage.setItem('rg1',JSON.stringify(S))}catch(x){}};
const lv=v=>v>=TH[2]?3:v>=TH[1]?2:v>=TH[0]?1:0,lab=i=>{const m=6*60+30*i;return String(m/60|0).padStart(2,'0')+':'+(m%60?'30':'00')};
const cur=s=>s.h[VIS[S.stage]-1],open=()=>S.inc.filter(i=>i.st<3);
const shS=s=>{const r=[];if(s.w<s.occ*2)r.push('water');if(s.b<s.occ)r.push('bedding');if(s.m<s.occ/10)r.push('medkits');return r};
const shSt=s=>s.occ>=s.cap?'Full':s.occ/s.cap>=.8?'Near capacity':'Open';
const toast=m=>{const t=document.createElement('div');t.className='t';t.textContent=m;$('#ts').append(t);setTimeout(()=>t.remove(),3200)};
const sevB=i=>`<span class="b" style="color:${SC[i]};border-color:${SC[i]}">${SEV[i]}</span>`;
const stB=i=>`<span class="b" style="color:${i==3?'#2dd4bf':i==0?'#fb923c':'#9aa7bf'};border-color:currentColor">${ST[i]}</span>`;
function advance(){if(S.stage>=3)return toast('Already at final stage');S.stage++;(ADD[S.stage]||[]).forEach(x=>S.inc.push({...x}));(BUMP[S.stage]||[]).forEach((d,k)=>S.sh[k].occ+=d);save();render();toast('Scenario: '+STG[S.stage]+' (simulated)')}
function mapSvg(big){const st=S.stage;let o=`<svg viewBox="${vb()}" style="width:100%;background:#0e1a2e;border-radius:8px;display:block" role="img" aria-label="Schematic hazard map of fictional Kestrel Valley (simulated)"><path d="M0,20 C20,30 25,60 45,70 S80,85 100,80" fill="none" stroke="#60a5fa" stroke-opacity="${.15+st*.08}" stroke-width="${3+st*5}" stroke-linecap="round"/><path d="M0,20 C20,30 25,60 45,70 S80,85 100,80" fill="none" stroke="#60a5fa" stroke-width="1.2"/>`;
Object.entries(AREAS).forEach(([n,[x,y]])=>o+=`<text x="${x}" y="${y+7}" text-anchor="middle">${n}</text>`);
if(U.L.shelter)S.sh.forEach(s=>o+=`<g class="mk"><title>${e(s.n)}: ${s.occ}/${s.cap} (simulated)</title><rect x="${s.x-2}" y="${s.y-2}" width="4" height="4" fill="#2dd4bf" stroke="#0b1220" stroke-width=".4"/></g>`);
if(U.L.sensor)SENS.forEach(s=>{const l=lv(cur(s));o+=`<g class="mk"><title>${e(s.n)}: ${cur(s)} m ${LV[l]} (simulated)</title><path d="M${s.x},${s.y-2.6}l2.6,2.6l-2.6,2.6l-2.6,-2.6z" fill="${LC[l]}" stroke="#0b1220" stroke-width=".4"/></g>`});
S.inc.forEach(i=>{const k=i.cat=='Flooding'||i.cat=='Blocked road'?i.cat:'report';if(!U.L[k]||(U.sev!==''&&i.sev!=U.sev)||(U.q&&!(i.title+i.loc).toLowerCase().includes(U.q.toLowerCase())))return;
o+=`<g class="mk" tabindex="0" role="button" aria-label="${e(i.title)}" data-act="sel" data-id="${i.id}" ${U.sel==i.id?'':''}><title>${e(i.id+' '+i.title)}</title>${U.sel==i.id?`<circle cx="${i.x}" cy="${i.y}" r="3.6" fill="none" stroke="#fff" stroke-width=".5"/>`:''}${i.st==3?'':`<circle cx="${i.x}" cy="${i.y}" r="${2+i.sev*.3}" fill="${SC[i.sev]}" fill-opacity=".9" stroke="#0b1220" stroke-width=".4"/>`}${i.st==3?`<circle cx="${i.x}" cy="${i.y}" r="1.5" fill="#2dd4bf" opacity=".6"/>`:''}${i.cat=='Blocked road'?`<path d="M${i.x-1.1},${i.y-1.1}l2.2,2.2m0,-2.2l-2.2,2.2" stroke="#0b1220" stroke-width=".5"/>`:''}</g>`});
return o+`<text x="2" y="87" style="font-size:2.6px">SIMULATED DATA · fictional Kestrel Valley · schematic, not to scale</text></svg>`}
function legend(){return `<div class="row mu" style="font-size:12px;margin-top:8px"><span>● Severity: ${SEV.map((s,i)=>`<b style="color:${SC[i]}">${s}</b>`).join(' ')}</span><span style="color:#2dd4bf">■ Shelter</span><span style="color:#60a5fa">◆ Sensor</span><span>✕ Blocked road</span></div>`}
function incDetail(i){if(!i)return '<p class="mu">Select an incident marker to see details.</p>';return `<div class="row sp"><b>${i.id}</b><span>${sevB(i.sev)} ${stB(i.st)}</span></div><h3 style="font-size:17px;text-transform:none;color:var(--tx);margin:8px 0">${e(i.title)}</h3><p class="mu">${e(i.cat)} · ${e(i.loc)}${i.road?' · '+e(i.road):''} · ${e(i.time)}</p><p>${e(i.d)}</p><p class="mu">Team: ${e(i.team||'Unassigned')}</p><label for="sst">Status</label><select id="sst" data-in="setst" data-id="${i.id}">${ST.map((s,k)=>`<option value="${k}" ${k==i.st?'selected':''}>${s}</option>`).join('')}</select><div class="row" style="margin-top:12px">${i.st==0?`<button class="p" data-act="ack" data-id="${i.id}">Acknowledge</button>`:''}${i.st<3?`<button data-act="res" data-id="${i.id}">Resolve</button>`:''}<button data-act="edit" data-id="${i.id}">Edit</button><button class="d" data-act="del" data-id="${i.id}">Delete</button></div>`}
function chart(){const W=300,H=130,P=22,mx=5.2;const X=i=>P+i*(W-P-6)/11,Y=v=>H-14-v/mx*(H-24);let o=`<svg viewBox="0 0 ${W} ${H}" style="width:100%" role="img" aria-label="Water level history by station">`;
[[TH[0],'#fbbf24','Watch'],[TH[1],'#fb923c','Warning'],[TH[2],'#ef4444','Critical']].forEach(([v,c,n])=>o+=`<line x1="${P}" x2="${W-4}" y1="${Y(v)}" y2="${Y(v)}" stroke="${c}" stroke-dasharray="3 3" stroke-opacity=".6"/><text x="${W-4}" y="${Y(v)-2}" text-anchor="end" style="font-size:7px;fill:${c}">${n} ${v} m</text>`);
[0,2,4,6].forEach(v=>o+=`<text x="2" y="${Y(v)+2}" style="font-size:7px">${v}</text>`);[0,3,6,9,11].forEach(i=>o+=`<text x="${X(i)}" y="${H-3}" text-anchor="middle" style="font-size:7px">${lab(i)}</text>`);
const cs=['#60a5fa','#2dd4bf','#f4efe6'];SENS.forEach((s,k)=>{o+=`<polyline fill="none" stroke="${cs[k]}" stroke-width="1.8" points="${s.h.slice(0,VIS[S.stage]).map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>`});
return o+'</svg><div class="row mu" style="font-size:12px">'+SENS.map((s,k)=>`<span style="color:${cs[k]}">● ${e(s.n)}</span>`).join('')+'</div>'}
function alerts(){const a=[];SENS.forEach(s=>{let p=0;s.h.slice(0,VIS[S.stage]).forEach((v,i)=>{const l=lv(v);if(l>p)a.push([i,s.n,l,v]);p=l})});return a.sort((x,y)=>y[0]-x[0])}
function prio(){return open().slice().sort((a,b)=>b.sev-a.sev||a.st-b.st).slice(0,4)}
function incRows(list,n){return list.length?`<div class="sc"><table><thead><tr><th>ID</th><th>Title</th><th>Location</th><th>Severity</th><th>Status</th><th>Time</th></tr></thead><tbody>${list.slice(0,n||99).map(i=>`<tr class="cl" tabindex="0" data-act="open" data-id="${i.id}"><td>${i.id}</td><td>${e(i.title)}</td><td>${e(i.loc)}</td><td>${sevB(i.sev)}</td><td>${stB(i.st)}</td><td>${e(i.time)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="mu">No incidents match. Clear filters or create a new incident.</p>'}
const filt=()=>S.inc.filter(i=>(!U.q||(i.title+i.loc+i.id+i.cat).toLowerCase().includes(U.q.toLowerCase()))&&(U.sev===''||i.sev==U.sev)&&(U.st===''||i.st==U.st)).sort((a,b)=>b.id.localeCompare(a.id));
const fbar=(m)=>`<div class="row" style="margin-bottom:12px"><input id="q" data-in="q" placeholder="Search incident or location" aria-label="Search" value="${e(U.q)}" style="max-width:260px"><select data-in="sev" aria-label="Severity filter"><option value="">All severities</option>${SEV.map((s,i)=>`<option value="${i}" ${U.sev===String(i)||U.sev===i?'selected':''}>${s}</option>`).join('')}</select>${m?'':`<select data-in="st" aria-label="Status filter"><option value="">All statuses</option>${ST.map((s,i)=>`<option value="${i}" ${U.st===String(i)||U.st===i?'selected':''}>${s}</option>`).join('')}</select>`}</div>`;
const occBar=s=>{const p=Math.min(100,s.occ/s.cap*100);return `<div class="bar" role="progressbar" aria-valuenow="${s.occ}" aria-valuemax="${s.cap}"><i style="width:${p}%;background:${p>=100?'#ef4444':p>=80?'#fb923c':'#2dd4bf'}"></i></div>`};
const head=(t,s)=>`<h2>${t}</h2><p class="sub">${s}</p>`;
const P={
dashboard(){const o=open(),cr=o.filter(i=>i.sev==3).length,occ=S.sh.reduce((a,s)=>a+s.occ,0),cap=S.sh.reduce((a,s)=>a+s.cap,0),mx=Math.max(...SENS.map(s=>lv(cur(s)))),sh=S.sh.filter(s=>shS(s).length).length;
return head('Command Dashboard','Situation overview for the fictional Kestrel Valley flood. All figures simulated.')+`<div class="hero"><div class="row sp"><b style="font-size:16px">Scenario status: <span style="color:var(--or)">${STG[S.stage].toUpperCase()}</span></b><span class="sim">SIMULATED</span></div><div class="mu">${WHY[S.stage]}</div></div>`+`<div class="g g4"><div class="c"><h3>Active incidents</h3><div class="k">${o.length}</div></div><div class="c" style="${cr?'border-color:#ef4444':''}"><h3>Critical alerts</h3><div class="k" style="color:${cr?'#ef4444':'#2dd4bf'}">${cr?'<span class="pulse"></span> ':''}${cr}</div></div><div class="c"><h3>Shelter occupancy</h3><div class="k">${occ}/${cap}</div>${occBar({occ,cap})}</div><div class="c"><h3>Supply shortages</h3><div class="k" style="color:${sh?'#fb923c':'#2dd4bf'}">${sh} <span class="mu" style="font-size:13px">shelters</span></div></div></div>
<div class="g dg" style="margin-top:12px"><div class="c"><h3>Hazard map · simulated</h3>${mapSvg()}${legend()}</div><div class="g"><div class="c"><h3>Response priorities</h3>${prio().length?prio().map((i,k)=>`<div class="row sp" style="padding:5px 0;cursor:pointer" tabindex="0" data-act="open" data-id="${i.id}"><span>${k+1}. ${e(i.title)}</span>${sevB(i.sev)}</div>`).join(''):'<p class="mu">No open incidents.</p>'}</div>
<div class="c"><h3>Water levels · overall ${LV[mx]}</h3><div class="g" style="grid-template-columns:repeat(3,1fr)">${SENS.map(s=>`<div><div class="mu" style="font-size:11px">${e(s.n)}</div><b style="font-size:20px;color:${LC[lv(cur(s))]}">${cur(s)} m</b><div style="font-size:11px;color:${LC[lv(cur(s))]}">${LV[lv(cur(s))]}</div></div>`).join('')}</div></div>
<div class="c"><h3>Activity timeline</h3>${S.inc.slice().reverse().slice(0,5).map(i=>`<div style="padding:3px 0"><span class="mu">${e(i.time)}</span> ${e(i.id)} · ${e(i.title)}</div>`).join('')}</div></div></div>
<div class="g g2" style="margin-top:12px"><div class="c"><h3>Water level trend (m, simulated)</h3>${chart()}</div><div class="c"><h3>Open incidents by severity</h3>${sevDist()}</div></div><div class="c" style="margin-top:12px"><h3>Recent incidents</h3>${incRows(S.inc.slice().reverse(),6)}</div>`},
map(){return head('Hazard Map','Schematic of fictional Kestrel Valley. Locations are simulated and not verified.')+fbar(1)+`<div class="row" style="margin-bottom:10px">${[['Flooding','Flooding'],['Blocked road','Blocked roads'],['report','Reports'],['shelter','Shelters'],['sensor','Sensors']].map(([k,n])=>`<label style="display:flex;gap:5px;margin:0;color:var(--tx)"><input type="checkbox" style="width:auto" data-in="layer" data-k="${k}" ${U.L[k]?'checked':''}>${n}</label>`).join('')}</div><div class="row" style="margin-bottom:8px"><button data-act="zin" aria-label="Zoom in" title="Zoom in">＋</button><button data-act="zout" aria-label="Zoom out" title="Zoom out">－</button><span class="mu">Zoom ${U.z||1}× (centres on selected incident)</span></div><div class="g dg"><div class="c">${mapSvg(1)}${legend()}</div><div class="c"><h3>Selected incident</h3>${incDetail(S.inc.find(i=>i.id==U.sel))}</div></div>`},
sensors(){const a=alerts();return head('Sensor Monitoring','<span class="sim">SIMULATION MODE</span> Readings are scripted for the demo, not from real IoT sensors.')+`<div class="row" style="margin-bottom:12px"><button class="p" data-act="adv">Advance scenario ▶ (${STG[S.stage]})</button><button data-act="rst">Reset</button></div><div class="g g4">${SENS.map(s=>{const v=cur(s),pv=s.h[VIS[S.stage]-2],l=lv(v);return `<div class="c"><h3>${e(s.n)}</h3><div class="k" style="color:${LC[l]}">${v} m</div><div class="mu">${LV[l]} · ${pv==null?'—':(v-pv>=0?'+':'')+(v-pv).toFixed(1)+' m / 30 min'}</div><div class="mu" style="font-size:12px">Status: online (simulated)</div></div>`}).join('')}</div><div class="g g2" style="margin-top:12px"><div class="c"><h3>History · thresholds 2.5 / 3.5 / 4.5 m</h3>${chart()}</div><div class="c"><h3>Alert history</h3>${a.length?a.map(x=>`<div style="padding:4px 0"><span class="mu">${lab(x[0])}</span> <b style="color:${LC[x[2]]}">${LV[x[2]]}</b> · ${e(x[1])} reached ${x[3]} m</div>`).join(''):'<p class="mu">No threshold crossings yet.</p>'}</div></div>`},
incidents(){return head('Incident Management','Create, triage and resolve incidents. Changes persist in this browser.')+`<div class="row sp"><div style="flex:1">${fbar()}</div><button class="p" data-act="new" style="margin-bottom:12px">+ New incident</button></div><div class="c">${incRows(filt())}</div>`},
shelters(){const need=S.sh.filter(s=>shS(s).length);return head('Shelters & Resources','Demo capacities and supplies. Edit values to see shortages update.')+`<div class="c" style="margin-bottom:12px"><h3>Resource needs</h3>${need.length?need.map(s=>`<div style="padding:3px 0"><b style="color:#fb923c">${e(s.n)}</b>: short on ${shS(s).join(', ')} for ${s.occ} occupants (rule of thumb: 2 L water, 1 bed per person, 1 medkit per 10)</div>`).join('')+'<p class="mu">No donations or dispatches are confirmed in this prototype.</p>':'<p style="color:#2dd4bf">No shortages detected.</p>'}</div><div class="g g2">${S.sh.map((s,k)=>`<div class="c"><div class="row sp"><b>${e(s.n)}</b><span class="b" style="color:${shSt(s)=='Open'?'#2dd4bf':'#fb923c'};border-color:currentColor">${shSt(s)}</span></div><div class="mu">${e(s.loc)} · available ${Math.max(0,s.cap-s.occ)} of ${s.cap}</div><div style="margin:8px 0">${occBar(s)}</div>${s.occ/s.cap>=.8?'<div class="er">⚠ Capacity warning</div>':''}<div class="row" style="margin-top:6px">${[['occ','Occupancy'],['w','Water (L)'],['b','Bedding'],['m','Medkits']].map(([f,n])=>`<div style="flex:1;min-width:70px"><label for="${s.id+f}">${n}</label><input id="${s.id+f}" type="number" min="0" ${f=='occ'?`max="${s.cap}"`:''} value="${s[f]}" data-in="sh" data-i="${k}" data-f="${f}"></div>`).join('')}</div><div class="mu" style="font-size:12px;margin-top:6px">Gaps: ${shS(s).join(', ')||'none'}</div></div>`).join('')}</div>`},
saferoute(){const r=ROUTES[U.rs],sh=S.sh.find(s=>s.id==U.rd);const opts=[[r[0],r[1],'Route A'],[r[2],r[3],'Route B']].map(([v,km,n])=>({v,km:(km+S.sh.indexOf(sh)*.8).toFixed(1),n,h:open().filter(i=>v.includes(i.road))}));const best=Math.min(...opts.map(o=>o.h.length));
return head('SafeRoute','Illustrative routes only. Unverified, not navigation, never guaranteed safe.')+`<div class="c row"><div><label for="rs">Start</label><select id="rs" data-in="rs">${Object.keys(AREAS).map(a=>`<option ${a==U.rs?'selected':''}>${a}</option>`).join('')}</select></div><div><label for="rd">Destination shelter</label><select id="rd" data-in="rd">${S.sh.map(s=>`<option value="${s.id}" ${s.id==U.rd?'selected':''}>${e(s.n)}</option>`).join('')}</select></div></div><p class="mu">${e(sh.n)}: ${sh.occ}/${sh.cap} occupied (simulated) ${shSt(sh)!='Open'?'<b class="er">· '+shSt(sh)+'</b>':''}</p><div class="g g2">${opts.map(o=>`<div class="c"><div class="row sp"><b>${o.n}: via ${o.v.join(' → ')}</b><span class="mu">~${o.km} km</span></div><p style="color:${o.h.length==best?'#2dd4bf':'#fb923c'};font-weight:600">${o.h.length?o.h.length+' reported hazard(s)':'No hazards reported (not verified)'}${o.h.length==best&&opts[0].h.length!=opts[1].h.length?' · fewer than alternative':''}</p>${o.h.map(i=>`<div style="padding:3px 0;cursor:pointer" tabindex="0" data-act="open" data-id="${i.id}">${sevB(i.sev)} ${e(i.title)}</div>`).join('')}</div>`).join('')}</div>`},
report(){const er=U.err;return head('Community Reporting','Submit a report. It creates a local incident record visible on the dashboard.')+`<form class="c" data-form="report" style="max-width:560px" novalidate>${formFields({cat:'Flooding',loc:'Market Ward',sev:1},er,1)}<label for="ph">Photo (optional, preview only)</label><input id="ph" type="file" accept="image/*" data-in="photo">${U.photo?`<img alt="Upload preview" src="${U.photo}" style="max-width:160px;margin-top:8px;border-radius:6px">`:''}<div style="margin-top:14px"><button class="p" type="submit">Submit report</button></div></form>`},
simulator(){return head('Scenario Simulator','<span class="sim">SIMULATED</span> Deterministic flood scenario. Stage drives sensors, incidents, map and shelters together.')+`<div class="c"><div class="row" style="margin-bottom:12px">${STG.map((n,i)=>`<span class="b" style="padding:5px 12px;color:${i==S.stage?'#1a0f05':'#9aa7bf'};background:${i==S.stage?'#fb923c':'transparent'};border-color:${i<=S.stage?'#fb923c':'#26334f'}">${i}. ${n}</span>`).join('')}</div><p><b>What changed and why:</b> ${WHY[S.stage]}</p><div class="row"><button class="p" data-act="adv" ${S.stage>=3?'disabled':''}>${S.stage==0?'Run Flood Scenario':'Advance to '+(STG[S.stage+1]||'—')}</button><button data-act="rst">Reset</button><button data-act="load">Load demo scenario</button></div></div><div class="g g2" style="margin-top:12px"><div class="c"><h3>Map</h3>${mapSvg()}${legend()}</div><div class="c"><h3>Gauges</h3>${chart()}<h3 style="margin-top:12px">Top priorities</h3>${prio().map(i=>`<div>${sevB(i.sev)} ${e(i.title)}</div>`).join('')||'<p class="mu">None</p>'}</div></div>`}};
function formFields(v,er,rep){const f=(k)=>er[k]?`<div class="er">${er[k]}</div>`:'';return `<label for="ft">Title</label><input id="ft" name="title" value="${e(v.title)}" aria-invalid="${!!er.title}">${f('title')}<label for="fc">Type</label><select id="fc" name="cat">${CAT.map(c=>`<option ${c==v.cat?'selected':''}>${c}</option>`).join('')}</select><label for="fl">Location</label><select id="fl" name="loc">${Object.keys(AREAS).map(c=>`<option ${c==v.loc?'selected':''}>${c}</option>`).join('')}</select><label for="fs">Severity</label><select id="fs" name="sev">${SEV.map((c,i)=>`<option value="${i}" ${i==v.sev?'selected':''}>${c}</option>`).join('')}</select>${rep?'':`<label for="ftm">Assigned team</label><input id="ftm" name="team" value="${e(v.team)}" placeholder="e.g. Team Alpha">`}<label for="fd">Description (min 15 characters)</label><textarea id="fd" name="d" rows="3" aria-invalid="${!!er.d}">${e(v.d)}</textarea>${f('d')}`}
const NAV=[['dashboard','Dashboard','▦'],['map','Hazard Map','◎'],['sensors','Sensors','≈'],['incidents','Incidents','!'],['shelters','Shelters','⌂'],['saferoute','SafeRoute','↗'],['report','Report','✎'],['simulator','Simulator','▶']];
function ntPanel(){const hi=open().filter(i=>i.sev>=2).sort((a,b)=>b.sev-a.sev).slice(0,5),al=alerts().slice(0,3);return `<div class="nt" role="dialog" aria-label="Notifications"><div class="row sp"><b>Alerts (simulated)</b><button data-act="nt">✕</button></div>${al.map(x=>`<div style="padding:6px 0;border-bottom:1px solid var(--bd)"><b style="color:${LC[x[2]]}">${LV[x[2]]}</b> · ${e(x[1])} at ${x[3]} m <span class="mu">${lab(x[0])}</span></div>`).join('')}${hi.map(i=>`<div style="padding:6px 0;border-bottom:1px solid var(--bd);cursor:pointer" tabindex="0" data-act="open" data-id="${i.id}">${sevB(i.sev)} ${e(i.title)}</div>`).join('')}${al.length+hi.length?'':'<p class="mu">No active alerts. Advance the scenario to generate some.</p>'}</div>`}
function sevDist(){const o=open(),m=Math.max(1,o.length);return SEV.map((s,k)=>{const n=o.filter(i=>i.sev==k).length;return `<div class="row" style="margin:6px 0"><span style="width:64px">${s}</span><div class="bar" style="flex:1"><i style="width:${n/m*100}%;background:${SC[k]};transition:width .4s"></i></div><b>${n}</b></div>`}).join('')}
function vb(){const z=U.z||1,w=100/z,h=90/z,i=S.inc.find(x=>x.id==U.sel),cx=i?i.x:50,cy=i?i.y:45;return Math.min(100-w,Math.max(0,cx-w/2))+' '+Math.min(90-h,Math.max(0,cy-h/2))+' '+w+' '+h}
function render(){const f=document.activeElement,fid=f&&f.id,pos=f&&f.selectionStart;
$('#side').className=U.nav?'o':'';$('#side').innerHTML=`<h1>▲ RescueGrid</h1><small>See the risk. Coordinate the response.</small>`+NAV.map(([k,n,ic])=>`<button class="nv ${U.page==k?'on':''}" data-act="nav" data-p="${k}" ${U.page==k?'aria-current="page"':''}><span aria-hidden="true">${ic}</span>${n}</button>`).join('');
$('#bar').innerHTML=`<button id="menu" data-act="menu" aria-label="Toggle navigation">☰</button><b>▲ RescueGrid</b><span class="sim" title="All data is simulated">DEMO · SIMULATION MODE</span><span class="mu">Stage: <b style="color:var(--tx)">${STG[S.stage]}</b></span><input id="gs" data-in="q" placeholder="Search incidents…" aria-label="Global incident search" value="${e(U.q)}" style="max-width:220px;margin-left:auto"><button data-act="nt" aria-label="Notifications" title="Notifications">🔔${(()=>{const n=open().filter(i=>i.sev>=2).length;return n?`<span class="bdg">${n}</span>`:''})()}</button><button data-act="tour" title="Two-minute walkthrough">Guided demo</button><button class="p" data-act="adv" title="Advance flood scenario">Advance ▶</button><button data-act="rst" title="Discard local changes">Reset</button><span class="av" title="Demo operator (no login)">DC</span>`;
$('#pg').innerHTML=P[U.page]();
const dr=S.inc.find(i=>i.id==U.dr);$('#ov').innerHTML=(U.nt?ntPanel():'')+(dr?`<aside id="dr" role="dialog" aria-label="Incident details"><div class="row sp" style="margin-bottom:10px"><b>Incident</b><button data-act="close">✕ Close</button></div>${incDetail(dr)}</aside>`:'')+(U.md?`<div id="md" role="dialog" aria-modal="true"><div>${modal()}</div></div>`:'');
if(fid){const n=document.getElementById(fid);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}}}
function modal(){const m=U.md;if(m.t=='form'){const v=m.v;return `<h2>${v.id?'Edit '+v.id:'New incident'}</h2><form data-form="inc" novalidate>${formFields(v,U.err)}<div class="row" style="margin-top:14px"><button class="p" type="submit">Save</button><button type="button" data-act="mclose">Cancel</button></div></form>`}
if(m.t=='confirm')return `<h2>${m.title}</h2><p class="mu">${m.msg}</p><div class="row"><button class="d" data-act="yes">Confirm</button><button data-act="mclose">Cancel</button></div>`;
return `<h2>Two-minute guided demo</h2><ol style="padding-left:18px"><li>Review the <button data-act="go" data-p="dashboard">dashboard</button> baseline.</li><li>Open <button data-act="go" data-p="sensors">Sensors</button> and press Advance to see levels rise (Watch).</li><li>Advance again to Warning, then view new hazards on the <button data-act="go" data-p="map">map</button>.</li><li>Submit a <button data-act="go" data-p="report">community report</button>.</li><li>Advance to Response, then check <button data-act="go" data-p="shelters">shelter shortages</button>.</li><li>In <button data-act="go" data-p="incidents">Incidents</button>, acknowledge or resolve one, then see the dashboard update.</li></ol><button data-act="mclose">Close</button>`}
function valid(fd){const er={};if(fd.title.trim().length<5)er.title='Title must be at least 5 characters.';if(fd.d.trim().length<15)er.d='Description must be at least 15 characters.';return er}
function mk(fd,id){const a=AREAS[fd.loc],n=S.n++;return {id:id||'INC-'+n,title:fd.title.trim(),cat:fd.cat,loc:fd.loc,sev:+fd.sev,st:0,team:fd.team||'',x:a[0]+(n%5)*2-4,y:a[1]+(n%4)*2-3,road:'',time:new Date().toTimeString().slice(0,5),d:fd.d.trim()}}
document.addEventListener('submit',ev=>{const f=ev.target.dataset.form;if(!f)return;ev.preventDefault();const fd=Object.fromEntries(new FormData(ev.target));const er=valid(fd);U.err=er;
if(Object.keys(er).length){if(f=='inc')U.md.v={...U.md.v,...fd};else U.fv=fd;render();return}
if(f=='inc'&&U.md.v.id){const i=S.inc.find(x=>x.id==U.md.v.id);Object.assign(i,{title:fd.title.trim(),cat:fd.cat,loc:fd.loc,sev:+fd.sev,team:fd.team,d:fd.d.trim()});toast('Incident updated')}
else{const i=mk(fd);S.inc.push(i);toast(f=='report'?'Report submitted as '+i.id+' (local record)':'Incident '+i.id+' created');if(f=='report'){U.photo='';U.md={t:'ok'};U.md=null;U.page='incidents';U.q=i.id}}
U.md=null;save();render()});
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,id=t.dataset.id,i=S.inc.find(x=>x.id==id);
const A={nt(){U.nt=!U.nt},zin(){U.z=Math.min(3,(U.z||1)+.5)},zout(){U.z=Math.max(1,(U.z||1)-.5)},nav(){U.page=t.dataset.p;U.nav=false;U.err={};U.z=1;U.nt=0},go(){U.page=t.dataset.p;U.md=null},menu(){U.nav=!U.nav},sel(){U.sel=id},open(){U.dr=id},close(){U.dr=null},mclose(){U.md=null;U.err={}},
ack(){i.st=1;toast(id+' acknowledged')},res(){i.st=3;toast(id+' resolved')},adv(){advance();return 1},tour(){U.md={t:'tour'}},
new(){U.err={};U.md={t:'form',v:{cat:'Flooding',loc:'Market Ward',sev:1,title:'',d:'',team:''}}},edit(){U.err={};U.md={t:'form',v:{...i}}},
del(){U.md={t:'confirm',title:'Delete '+id+'?',msg:'This removes the incident from local data.',do(){S.inc=S.inc.filter(x=>x.id!=id);U.dr=null;if(U.sel==id)U.sel=null;toast('Incident deleted')}}},
rst(){U.md={t:'confirm',title:'Reset demo?',msg:'All local changes will be discarded and the scenario returns to Baseline.',do(){S=SEED();U.dr=null;U.sel=null;toast('Demo reset')}}},
load(){S=SEED();advance();advance();U.page='dashboard';toast('Demo scenario loaded (Warning stage)');return 1},
yes(){U.md.do();U.md=null}};
if(A[a]&&A[a]()!==1||a=='adv'||a=='load'){}save();if(a!='adv'&&a!='load')render()});
document.addEventListener('change',ev=>{const t=ev.target,k=t.dataset.in;if(!k)return;const A={setst(){S.inc.find(x=>x.id==t.dataset.id).st=+t.value;toast('Status updated')},layer(){U.L[t.dataset.k]=t.checked},sev(){U.sev=t.value},st(){U.st=t.value},rs(){U.rs=t.value},rd(){U.rd=t.value},
sh(){const s=S.sh[+t.dataset.i],v=Math.max(0,+t.value||0);s[t.dataset.f]=t.dataset.f=='occ'?Math.min(v,s.cap):v;toast('Updated '+s.n)},
photo(){const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{U.photo=r.result;render()};r.readAsDataURL(f);return 1}};
if(A[k]&&A[k]()!==1){save();render()}});
document.addEventListener('input',ev=>{if(ev.target.dataset.in=='q'){U.q=ev.target.value;if(ev.target.id=='gs'&&!['incidents','map'].includes(U.page))U.page='incidents';render()}});
document.addEventListener('keydown',ev=>{if(ev.key=='Escape'){U.md=null;U.dr=null;render()}if((ev.key=='Enter'||ev.key==' ')&&ev.target.dataset&&ev.target.dataset.act&&ev.target.tagName!='BUTTON'){ev.preventDefault();ev.target.click()}});
render();
</script></body></html>
